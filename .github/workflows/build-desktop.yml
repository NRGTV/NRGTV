name: Build Desktop & Android

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # ─────────────────────────────────────────────────────────
  # 1. Build the Vite PWA
  # ─────────────────────────────────────────────────────────
  build-web:
    name: Build Vite app
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile=false

      - name: Build NRG-TV
        working-directory: artifacts/energy-tv
        env:
          BASE_PATH: /
          VITE_TMDB_API_KEY: ${{ secrets.VITE_TMDB_API_KEY }}
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_APP_BUILD: ${{ github.run_number }}
        run: pnpm run build

      - name: Upload web dist
        uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: artifacts/energy-tv/dist/public
          retention-days: 1

  # ─────────────────────────────────────────────────────────
  # 2. Electron builds
  # ─────────────────────────────────────────────────────────
  build-electron:
    name: Electron – ${{ matrix.os-label }}
    needs: build-web
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            os-label: Linux
            electron-target: linux
          - os: macos-latest
            os-label: macOS
            electron-target: mac
          - os: windows-latest
            os-label: Windows
            electron-target: win

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Download web dist
        uses: actions/download-artifact@v4
        with:
          name: web-dist
          path: electron/renderer

      - name: Create Electron package.json
        shell: bash
        run: |
          mkdir -p electron
          cat > electron/package.json << 'EOF'
          {
            "name": "nrgtv-desktop",
            "version": "1.0.${{ github.run_number }}",
            "description": "NRGTV Desktop",
            "main": "main.js",
            "author": {
              "name": "NRGTV",
              "email": "info@nrgtv.space"
            },
            "license": "MIT",
            "repository": {
              "type": "git",
              "url": "https://github.com/NRGTV/NRGTV"
            },
            "scripts": {
              "dist": "electron-builder"
            },
            "build": {
              "appId": "com.nrgtv.nrgtv",
              "productName": "NRGTV",
              "directories": {
                "output": "dist-electron"
              },
              "files": [
                "main.js",
                "preload.js",
                "renderer/**/*"
              ],
              "publish": {
                "provider": "github",
                "owner": "NRGTV",
                "repo": "NRGTV"
              },
              "linux": {
                "target": ["deb", "AppImage"],
                "category": "AudioVideo",
                "artifactName": "NRGTV.${ext}"
              },
              "mac": {
                "target": ["dmg"],
                "category": "public.app-category.entertainment",
                "artifactName": "NRGTV.${ext}"
              },
              "win": {
                "target": ["nsis"],
                "artifactName": "NRGTV-Setup.${ext}"
              }
            },
            "dependencies": {
              "electron-updater": "^6.3.9"
            },
            "devDependencies": {
              "electron": "^31.0.0",
              "electron-builder": "^24.13.3"
            }
          }
          EOF

      - name: Create Electron main.js
        shell: bash
        run: |
          cat > electron/main.js << 'EOF'
          const { app, BrowserWindow, session } = require('electron');
          const { autoUpdater } = require('electron-updater');
          const path = require('path');

          function createWindow() {
            const win = new BrowserWindow({
              width: 1280,
              height: 800,
              minWidth: 800,
              minHeight: 600,
              title: 'NRGTV',
              webPreferences: {
                preload: path.join(__dirname, 'preload.js'),
                contextIsolation: true,
                nodeIntegration: false,
                // The boot loading screen plays a sound effect immediately
                // on mount, before any user gesture — Chromium blocks that
                // by default. This is a local packaged app, not a random
                // website, so it's safe to relax that here.
                autoplayPolicy: 'no-user-gesture-required',
              },
            });

            // Block every attempt to open a new window/tab (popups, popunders,
            // target="_blank" links, window.open — including from embedded
            // iframes). Nothing is ever allowed to spawn its own window.
            win.webContents.setWindowOpenHandler(({ url }) => {
              console.log(`[NRGTV] Blocked new-window request: ${url}`);
              return { action: 'deny' };
            });

            // Domains the video player iframe is allowed to load/navigate to —
            // kept in sync with SOURCES in PlayerModal.tsx (111movies.com is
            // the only player source currently). Everything else — ad
            // redirects hijacking the iframe, popunder scripts, tracker
            // bounces — gets blocked, whether it targets the main window or
            // a nested frame.
            const ALLOWED_FRAME_HOSTS = ['111movies.com', 'tmdb.org', 'themoviedb.org'];

            const hostAllowed = (urlStr) => {
              try {
                const { hostname } = new URL(urlStr);
                return ALLOWED_FRAME_HOSTS.some((h) => hostname === h || hostname.endsWith(`.${h}`));
              } catch {
                return false;
              }
            };

            // will-frame-navigate fires for EVERY frame (main window AND any
            // nested iframe), unlike the legacy will-navigate/will-redirect
            // events which only ever cover the top-level frame. This is what
            // actually catches an ad script redirecting the player iframe.
            win.webContents.on('will-frame-navigate', (event) => {
              const { url, isMainFrame } = event;

              if (isMainFrame) {
                if (!url.startsWith('file://')) {
                  console.log(`[NRGTV] Blocked main-window navigation: ${url}`);
                  event.preventDefault();
                }
                return;
              }

              if (!hostAllowed(url)) {
                console.log(`[NRGTV] Blocked frame redirect: ${url}`);
                event.preventDefault();
              }
            });

            session.defaultSession.webRequest.onHeadersReceived((details, callback) => {
              callback({
                responseHeaders: {
                  ...details.responseHeaders,
                  'Content-Security-Policy': [
                    "default-src 'self' 'unsafe-inline' 'unsafe-eval' data: blob: https: http:;"
                  ],
                },
              });
            });

            win.loadFile(path.join(__dirname, 'renderer', 'index.html'));
          }

          app.whenReady().then(() => {
            createWindow();
            app.on('activate', () => {
              if (BrowserWindow.getAllWindows().length === 0) createWindow();
            });

            // Auto-update via electron-updater against GitHub Releases (see
            // the "publish" block in package.json). Every push builds and
            // publishes a new release, so this effectively means "always on
            // the latest commit" for anyone who leaves the app open.
            //
            // NOTE: macOS auto-update (Squirrel.Mac) requires the app to be
            // code-signed and notarized — we don't have an Apple developer
            // cert, so it's skipped there. Mac users still get new builds,
            // just via a manual download from nrgtv.space/download.
            if (process.platform !== 'darwin') {
              autoUpdater.autoDownload = true;
              autoUpdater.autoInstallOnAppQuit = true;

              autoUpdater.on('error', (err) => {
                console.log(`[NRGTV] Updater error: ${err == null ? 'unknown' : err.toString()}`);
              });
              autoUpdater.on('update-available', (info) => {
                console.log(`[NRGTV] Update available: ${info.version}`);
              });
              autoUpdater.on('update-downloaded', (info) => {
                console.log(`[NRGTV] Update downloaded: ${info.version} — will install on quit`);
              });

              autoUpdater.checkForUpdatesAndNotify();
              // Re-check periodically for anyone who leaves the app open a
              // long time (every 4 hours).
              setInterval(() => autoUpdater.checkForUpdatesAndNotify(), 4 * 60 * 60 * 1000);
            }
          });

          app.on('window-all-closed', () => {
            if (process.platform !== 'darwin') app.quit();
          });
          EOF

      - name: Create preload.js
        shell: bash
        run: |
          cat > electron/preload.js << 'EOF'
          // IPC bridge placeholder
          EOF

      - name: Copy app icon
        shell: bash
        run: mkdir -p electron/build && cp build-resources/icon-1024.png electron/build/icon.png

      - name: Install Electron deps
        working-directory: electron
        run: npm install

      - name: Build Electron app
        working-directory: electron
        run: npx electron-builder --${{ matrix.electron-target }} --publish never

      - name: Upload Electron artifacts
        uses: actions/upload-artifact@v4
        with:
          name: electron-${{ matrix.os-label }}
          path: |
            electron/dist-electron/**/*.deb
            electron/dist-electron/**/*.AppImage
            electron/dist-electron/**/*.dmg
            electron/dist-electron/**/*.exe
            electron/dist-electron/**/*.blockmap
            electron/dist-electron/latest*.yml
          if-no-files-found: warn

  # ─────────────────────────────────────────────────────────
  # 3. Android APK
  # ─────────────────────────────────────────────────────────
  build-apk:
    name: Android APK
    needs: build-web
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Download web dist
        uses: actions/download-artifact@v4
        with:
          name: web-dist
          path: capacitor-app/www

      - name: Create Capacitor project
        run: |
          mkdir -p capacitor-app
          cat > capacitor-app/package.json << 'EOF'
          {
            "name": "nrg-tv-android",
            "version": "1.0.${{ github.run_number }}",
            "dependencies": {
              "@capacitor/android": "^6.0.0",
              "@capacitor/cli": "^6.0.0",
              "@capacitor/core": "^6.0.0"
            }
          }
          EOF

          cat > capacitor-app/capacitor.config.json << 'EOF'
          {
            "appId": "space.nrgtv.nrgtv",
            "appName": "NRGTV",
            "webDir": "www"
          }
          EOF

      - name: Install Capacitor
        working-directory: capacitor-app
        run: npm install

      - name: Setup Android
        working-directory: capacitor-app
        run: |
          npx cap add android
          npx cap sync android

      - name: Harden Android WebView against embed redirects/popups
        working-directory: capacitor-app
        run: |
          python3 - << 'PY'
          import pathlib

          # Extends Capacitor's own BridgeWebViewClient (rather than replacing
          # it outright) so the JS-bridge URL handling Capacitor relies on
          # still works — this only adds a check on top of it. Mirrors the
          # Electron build's protection: block anything trying to navigate
          # the main frame away from the app's own bundled origin (that's
          # what an ad redirect hijacking the whole app looks like), and
          # block every popup/new-window attempt outright. Deliberately does
          # NOT allowlist by host — that would need updating every time a
          # source is added/removed, and app-shell hijacks/popups are the
          # same regardless of which of the six sources triggers them.
          path = pathlib.Path("android/app/src/main/java/space/nrgtv/nrgtv/MainActivity.java")
          path.write_text('''package space.nrgtv.nrgtv;

          import android.os.Bundle;
          import android.os.Message;
          import android.util.Log;
          import android.webkit.WebChromeClient;
          import android.webkit.WebResourceRequest;
          import android.webkit.WebView;
          import com.getcapacitor.BridgeActivity;
          import com.getcapacitor.BridgeWebViewClient;

          public class MainActivity extends BridgeActivity {
              // Origin Capacitor serves the bundled web app from (default
              // androidScheme is "https", served from localhost).
              private static final String APP_ORIGIN = "https://localhost";

              @Override
              public void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);

                  WebView webView = this.bridge.getWebView();

                  webView.setWebViewClient(new BridgeWebViewClient(this.bridge) {
                      @Override
                      public boolean shouldOverrideUrlLoading(WebView view, WebResourceRequest request) {
                          if (request.isForMainFrame()) {
                              String url = request.getUrl().toString();
                              if (!url.startsWith(APP_ORIGIN)) {
                                  Log.w("NRGTV", "Blocked main-frame redirect: " + url);
                                  return true; // block — do not navigate the whole app away
                              }
                          }
                          // Anything else (including the video iframe loading/
                          // navigating within itself) falls through to Capacitor's
                          // own handling.
                          return super.shouldOverrideUrlLoading(view, request);
                      }
                  });

                  webView.setWebChromeClient(new WebChromeClient() {
                      @Override
                      public boolean onCreateWindow(WebView view, boolean isDialog, boolean isUserGesture, Message resultMsg) {
                          Log.w("NRGTV", "Blocked popup window request");
                          return false;
                      }
                  });
              }
          }
          ''')
          print("Patched MainActivity.java")
          PY

      - name: Generate Android app icon
        working-directory: capacitor-app
        run: mkdir -p assets && cp ../build-resources/icon-1024.png assets/icon.png && npm install --save-dev @capacitor/assets && npx capacitor-assets generate --android

      - name: Decode keystore & set signing env
        working-directory: capacitor-app
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          mkdir -p android/app
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > android/app/release.keystore
          echo "ANDROID_KEYSTORE_PATH=$(pwd)/android/app/release.keystore" >> "$GITHUB_ENV"
          echo "ANDROID_KEYSTORE_PASSWORD=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}" >> "$GITHUB_ENV"
          echo "ANDROID_KEY_ALIAS=${{ secrets.ANDROID_KEY_ALIAS }}" >> "$GITHUB_ENV"
          echo "ANDROID_KEY_PASSWORD=${{ secrets.ANDROID_KEY_PASSWORD }}" >> "$GITHUB_ENV"

      - name: Configure release signing
        working-directory: capacitor-app/android/app
        run: |
          python3 - << 'PY'
          path = "build.gradle"
          with open(path) as f:
              content = f.read()

          signing_block = """
              signingConfigs {
                  release {
                      storeFile file(System.getenv("ANDROID_KEYSTORE_PATH"))
                      storePassword System.getenv("ANDROID_KEYSTORE_PASSWORD")
                      keyAlias System.getenv("ANDROID_KEY_ALIAS")
                      keyPassword System.getenv("ANDROID_KEY_PASSWORD")
                  }
              }
          """
          content = content.replace("android {", "android {\n" + signing_block, 1)
          content = content.replace(
              "release {\n            minifyEnabled false",
              "release {\n            signingConfig signingConfigs.release\n            minifyEnabled false",
          )

          with open(path, "w") as f:
              f.write(content)
          PY

      - name: Build APK
        working-directory: capacitor-app/android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: capacitor-app/android/app/build/outputs/apk/release/app-release.apk

  # ─────────────────────────────────────────────────────────
  # 4. Release
  # ─────────────────────────────────────────────────────────
  release:
    name: Publish Release
    needs: [build-electron, build-apk]
    runs-on: ubuntu-latest

    steps:
      - name: Download Electron artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          pattern: 'electron-*'
          merge-multiple: true

      - name: Download APK
        uses: actions/download-artifact@v4
        with:
          name: android-apk
          path: release-assets

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Build ${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          files: release-assets/**/*
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
