name: Build Desktop & Android

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # ─────────────────────────────────────────────────────────
  # 1. Build the Vite PWA
  # ─────────────────────────────────────────────────────────
  build-web:
    name: Build Vite app
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile=false

      - name: Build NRG-TV
        working-directory: artifacts/energy-tv
        env:
          BASE_PATH: /
          VITE_TMDB_API_KEY: ${{ secrets.VITE_TMDB_API_KEY }}
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        run: pnpm run build

      - name: Upload web dist
        uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: artifacts/energy-tv/dist/public
          retention-days: 1

  # ─────────────────────────────────────────────────────────
  # 2. Electron builds
  # ─────────────────────────────────────────────────────────
  build-electron:
    name: Electron – ${{ matrix.os-label }}
    needs: build-web
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            os-label: Linux
            electron-target: linux
          - os: macos-latest
            os-label: macOS
            electron-target: mac
          - os: windows-latest
            os-label: Windows
            electron-target: win

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Download web dist
        uses: actions/download-artifact@v4
        with:
          name: web-dist
          path: electron/renderer

      - name: Create Electron package.json
        shell: bash
        run: |
          mkdir -p electron
          cat > electron/package.json << 'EOF'
          {
            "name": "nrgtv-desktop",
            "version": "11.0.0",
            "description": "NRGTV Desktop",
            "main": "main.js",
            "author": {
              "name": "NRGTV",
              "email": "info@nrgtv.space"
            },
            "license": "MIT",
            "repository": {
              "type": "git",
              "url": "https://github.com/NRGTV/NRGTV"
            },
            "scripts": {
              "dist": "electron-builder"
            },
            "build": {
              "appId": "com.nrgtv.nrgtv",
              "productName": "NRGTV",
              "directories": {
                "output": "dist-electron"
              },
              "files": [
                "main.js",
                "preload.js",
                "renderer/**/*"
              ],
              "linux": {
                "target": ["deb"],
                "category": "AudioVideo"
              },
              "mac": {
                "target": ["dmg"],
                "category": "public.app-category.entertainment"
              },
              "win": {
                "target": ["nsis"]
              }
            },
            "devDependencies": {
              "electron": "^31.0.0",
              "electron-builder": "^24.13.3"
            }
          }
          EOF

      - name: Create Electron main.js
        shell: bash
        run: |
          cat > electron/main.js << 'EOF'
          const { app, BrowserWindow, session } = require('electron');
          const path = require('path');

          function createWindow() {
            const win = new BrowserWindow({
              width: 1280,
              height: 800,
              minWidth: 800,
              minHeight: 600,
              title: 'NRGTV',
              webPreferences: {
                preload: path.join(__dirname, 'preload.js'),
                contextIsolation: true,
                nodeIntegration: false,
              },
            });

            session.defaultSession.webRequest.onHeadersReceived((details, callback) => {
              callback({
                responseHeaders: {
                  ...details.responseHeaders,
                  'Content-Security-Policy': [
                    "default-src 'self' 'unsafe-inline' 'unsafe-eval' data: blob: https: http:;"
                  ],
                },
              });
            });

            win.loadFile(path.join(__dirname, 'renderer', 'index.html'));
          }

          app.whenReady().then(() => {
            createWindow();
            app.on('activate', () => {
              if (BrowserWindow.getAllWindows().length === 0) createWindow();
            });
          });

          app.on('window-all-closed', () => {
            if (process.platform !== 'darwin') app.quit();
          });
          EOF

      - name: Create preload.js
        shell: bash
        run: |
          cat > electron/preload.js << 'EOF'
          // IPC bridge placeholder
          EOF

      - name: Install Electron deps
        working-directory: electron
        run: npm install

      - name: Build Electron app
        working-directory: electron
        run: npx electron-builder --${{ matrix.electron-target }} --publish never

      - name: Upload Electron artifacts
        uses: actions/upload-artifact@v4
        with:
          name: electron-${{ matrix.os-label }}
          path: |
            electron/dist-electron/**/*.deb
            electron/dist-electron/**/*.dmg
            electron/dist-electron/**/*.exe
          if-no-files-found: warn

  # ─────────────────────────────────────────────────────────
  # 3. Android APK
  # ─────────────────────────────────────────────────────────
  build-apk:
    name: Android APK
    needs: build-web
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Download web dist
        uses: actions/download-artifact@v4
        with:
          name: web-dist
          path: capacitor-app/www

      - name: Create Capacitor project
        run: |
          mkdir -p capacitor-app
          cat > capacitor-app/package.json << 'EOF'
          {
            "name": "nrg-tv-android",
            "version": "1.0.0",
            "dependencies": {
              "@capacitor/android": "^6.0.0",
              "@capacitor/cli": "^6.0.0",
              "@capacitor/core": "^6.0.0"
            }
          }
          EOF

          cat > capacitor-app/capacitor.config.json << 'EOF'
          {
            "appId": "space.nrgtv.nrgtv",
            "appName": "NRGTV",
            "webDir": "www"
          }
          EOF

      - name: Install Capacitor
        working-directory: capacitor-app
        run: npm install

      - name: Setup Android
        working-directory: capacitor-app
        run: |
          npx cap add android
          npx cap sync android

      - name: Decode keystore & set signing env
        working-directory: capacitor-app
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          mkdir -p android/app
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > android/app/release.keystore
          echo "ANDROID_KEYSTORE_PATH=$(pwd)/android/app/release.keystore" >> "$GITHUB_ENV"
          echo "ANDROID_KEYSTORE_PASSWORD=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}" >> "$GITHUB_ENV"
          echo "ANDROID_KEY_ALIAS=${{ secrets.ANDROID_KEY_ALIAS }}" >> "$GITHUB_ENV"
          echo "ANDROID_KEY_PASSWORD=${{ secrets.ANDROID_KEY_PASSWORD }}" >> "$GITHUB_ENV"

      - name: Configure release signing
        working-directory: capacitor-app/android/app
        run: |
          python3 - << 'PY'
          path = "build.gradle"
          with open(path) as f:
              content = f.read()

          signing_block = """
              signingConfigs {
                  release {
                      storeFile file(System.getenv("ANDROID_KEYSTORE_PATH"))
                      storePassword System.getenv("ANDROID_KEYSTORE_PASSWORD")
                      keyAlias System.getenv("ANDROID_KEY_ALIAS")
                      keyPassword System.getenv("ANDROID_KEY_PASSWORD")
                  }
              }
          """
          content = content.replace("android {", "android {\n" + signing_block, 1)
          content = content.replace(
              "release {\n            minifyEnabled false",
              "release {\n            signingConfig signingConfigs.release\n            minifyEnabled false",
          )

          with open(path, "w") as f:
              f.write(content)
          PY

      - name: Build APK
        working-directory: capacitor-app/android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: capacitor-app/android/app/build/outputs/apk/release/app-release.apk

  # ─────────────────────────────────────────────────────────
  # 4. Release
  # ─────────────────────────────────────────────────────────
  release:
    name: Publish Release
    needs: [build-electron, build-apk]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')

    steps:
      - name: Download Electron artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          pattern: 'electron-*'
          merge-multiple: true

      - name: Download APK
        uses: actions/download-artifact@v4
        with:
          name: android-apk
          path: release-assets

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release-assets/**/*
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
